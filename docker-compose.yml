services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: sidq }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/sidq
      OPERATOR_API_KEY: change-me
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
